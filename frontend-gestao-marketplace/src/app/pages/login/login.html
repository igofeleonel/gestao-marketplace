<form class="flex p-4 w-full justify-between" [formGroup]="useForm" (ngSubmit)="login()">
  <!-- Logo -->
  <div class="p-6">
    <div class="flex items-center">
      <img class="w-24 h-24 mr-4" src="logo.svg" alt="Logotipo Marketplace" routerLink="/header" />
      <div>
        <h2 class="font-bold">Marketplace</h2>
        <h4>Painel de Vendedor</h4>
      </div>
    </div>
    <img src="login-background.svg" alt="" aria-hidden="true" />
  </div>

  <!-- Formulário -->
  <div class="flex flex-col justify-between gap-8 p-8 w-3/6 bg-white rounded-2xl">
    <div>
      <h2 class="font-bold">Acesse sua conta</h2>
      <p class="font-light text-xs text-gray-600">Informe seu e-mail e senha para entrar</p>
    </div>

    <div class="flex flex-col gap-10">
      <!-- Email -->
      <div class="flex flex-col gap-2 border-b border-gray-300 pb-2">
        <label class="text-gray-600 text-xs">E-MAIL</label>
        <div class="flex">
          <img class="mr-2 w-5 h-5" src="mail.svg" />
          <input
            class="text-sm focus:outline-none"
            type="email"
            placeholder="Seu e-mail cadastrado"
            formControlName="email"
          />
        </div>
      </div>

      <!-- Senha -->
      <div class="flex flex-col gap-2 border-b border-gray-300 pb-2">
        <label class="text-gray-600 text-xs">SENHA</label>
        <div class="flex">
          <img class="mr-2 w-5 h-5" src="access.svg" />
          <input
            class="text-sm focus:outline-none"
            type="password"
            placeholder="Sua senha de acesso"
            formControlName="password"
          />
        </div>
      </div>

      @if (loginErrorMessage) {
      <p class="text-red-500 font-bold">{{ loginErrorMessage }}</p>
      }
    </div>

    <!-- BOTÃO (AGORA FUNCIONA) -->
    <button
      type="submit"
      [disabled]="useForm.invalid"
      class="flex justify-between items-center p-4 rounded-xl text-white"
      [ngClass]="
        useForm.invalid
          ? 'bg-gray-500 cursor-not-allowed'
          : 'bg-[#F24D0D] active:translate-y-1 transition'
      "
    >
      <span>Acessar</span>
      <img class="w-4 h-4" src="right-arrow.svg" />
    </button>
  </div>
</form>
