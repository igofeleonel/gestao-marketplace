<form
  class="w-full py-7 px-14 flex flex-col gap-6"
  [formGroup]="productForm"
  (ngSubmit)="saveProduct()"
>
  <!-- Header -->
  <div>
    <h2 class="font-bold">Novo produto</h2>
    <h4 class="font-light text-xs text-gray-600">Cadastre um produto para venda no marketplace</h4>
  </div>

  <div class="flex gap-4 items-start">
    <!-- Upload imagem -->
    <label
      for="image-upload-input"
      class="p-16 cursor-pointer rounded-4xl w-1/3 flex flex-col justify-center items-center gap-4 bg-[#F5EAEA]"
      role="button"
    >
      <img src="image-upload.svg" alt="Ícone de upload da imagem" />
      <p class="text-gray-600 text-center">
        Selecione a imagem <br />
        do produto
      </p>
    </label>

    <input
      id="image-upload-input"
      type="file"
      class="hidden"
      accept=".png,.jpg,.jpeg"
      (change)="onFileSelected($event)"
    />

    <!-- Dados do produto -->
    <div class="p-8 bg-white rounded-4xl flex-1 flex flex-col gap-7">
      <h3 class="text-gray-500 font-medium">Dados do produto</h3>

      <div class="flex flex-col gap-5">
        <!-- Título e valor -->
        <div class="flex">
          <div class="flex flex-col gap-2 border-b border-gray-300 pb-2 w-4/5 mr-6">
            <label class="text-gray-600 text-xs">TÍTULO</label>
            <input
              type="text"
              formControlName="title"
              placeholder="Nome do produto"
              class="text-gray-400 text-sm focus:outline-none"
            />
          </div>

          <div class="flex flex-col gap-2 border-b border-gray-300 pb-2 flex-1">
            <label class="text-gray-600 text-xs">VALOR</label>
            <div class="flex gap-2">
              <span>R$</span>
              <input
                type="number"
                formControlName="price"
                placeholder="0,00"
                class="text-gray-400 text-sm focus:outline-none"
              />
            </div>
          </div>
        </div>

        <!-- Descrição -->
        <div class="flex flex-col gap-2 border-b border-gray-300 pb-2">
          <label class="text-gray-600 text-xs">DESCRIÇÃO</label>
          <input
            type="text"
            formControlName="description"
            placeholder="Detalhes do produto"
            class="text-gray-400 text-sm focus:outline-none"
          />
        </div>

        <!-- Categoria -->
        <div class="flex flex-col gap-2 border-b border-gray-300 pb-2">
          <label class="text-gray-600 text-xs">CATEGORIA</label>
          <select
            formControlName="category"
            class="w-full bg-white text-gray-400 text-sm focus:outline-none"
          >
            <option value="" disabled hidden>Selecione</option>
            <option value="Móvel">Móvel</option>
            <option value="Papelaria">Papelaria</option>
            <option value="Saúde & Beleza">Saúde & Beleza</option>
            <option value="Utensílio">Utensílio</option>
            <option value="Vestuário">Vestuário</option>
          </select>
        </div>
      </div>

      <!-- Botões -->
      <div class="w-full flex gap-4">
        <!-- Botão Cancelar -->
        <button
          type="button"
          class="flex flex-1 justify-center p-3 rounded-lg border border-[#F24D0D] bg-white active:translate-y-1 transition"
          type="button"
          (click)="cancel()"
        >
          <span class="text-[#F24D0D] text-sm">Cancelar</span>
        </button>

        <button
          type="submit"
          [disabled]="!canSubmit"
          class="flex flex-1 justify-center p-3 rounded-lg text-white transition"
          [ngClass]="{
            'bg-[#F24D0D] cursor-pointer active:translate-y-1': canSubmit,
            'bg-gray-500 cursor-not-allowed': !canSubmit
          }"
        >
          <span class="text-sm">Salvar e publicar</span>
        </button>
      </div>

      @if (successMessage) {
      <p class="font-bold text-green-500" role="status">
        {{ successMessage }}
      </p>
      }
    </div>
  </div>
</form>
